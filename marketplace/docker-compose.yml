services:

  # PostgreSQL
  marketplace-postgres:
    image: postgres:16
    container_name: postgres-marketplace-service
    restart: unless-stopped
    ports:
      - 5434:5432
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace_user
      POSTGRES_PASSWORD: marketplace_pass
    volumes:
      - ./src/main/resources/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - join-in-network

  # Adminer PostgreSQL web tool
  marketplace-adminer:
    image: adminer:4
    container_name: adminer-marketplace-service
    restart: unless-stopped
    depends_on:
      - marketplace-postgres
    ports:
      - 9093:8080
    environment:
      ADMINER_DEFAULT_SERVER: marketplace-postgres
    networks:
      - join-in-network

  # Marketplace Service
  marketplace-service:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - maven_settings
    container_name: marketplace-service
    restart: unless-stopped
    ports:
      - 8089:8089
    depends_on:
      - marketplace-postgres
    networks:
      - join-in-network

networks:
  join-in-network:
    external: true

secrets:
  maven_settings:
    file: C:/Users/Иван/.m2/settings.xml