server:
  port: 8082
  max-http-header-size: 10MB

spring:
  application:
    name: identity

  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/storage}
    auto-index-creation: true

  kafka:
    bootstrap-servers: kafka:19092
    group-id: groupId
    trusted-packages: com.join_in.kafka_models.messages
    offset-reset: earliest
    topic:
      register-new-user: register-new-user

