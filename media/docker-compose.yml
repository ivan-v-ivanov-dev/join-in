services:

  # MongoDB
  media-mongo:
    image: mongo:6.0
    container_name: mongo-media-service
    volumes:
      - ./src/main/resources/mongo/init.js:/docker-entrypoint-initdb.d/init.js
    ports:
      - 27020:27017
    environment:
      - MONGO_INITDB_ROOT_USERNAME=rootuser
      - MONGO_INITDB_ROOT_PASSWORD=rootpass
      - MONGO_INITDB_DATABASE=storage
    networks:
      - join-in-network

  # Mongo Express web tool
  media-mongo-express:
    image: mongo-express:1.0.0-alpha
    container_name: mongo-express-media-service
    restart: always
    depends_on:
      - media-mongo
    ports:
      - 9093:8081
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=rootuser
      - ME_CONFIG_MONGODB_ADMINPASSWORD=rootpass
      - ME_CONFIG_MONGODB_URL=mongodb://rootuser:rootpass@media-mongo:27017/
    networks:
      - join-in-network

  # Media Service
  media-service:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - maven_settings
    container_name: media-service
    ports:
      - 8090:8090
    depends_on:
      - media-mongo
    networks:
      - join-in-network

networks:
  join-in-network:
    external: true

secrets:
  maven_settings:
    file: C:/Users/Иван/.m2/settings.xml