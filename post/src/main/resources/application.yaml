server:
  port: 8084
  max-http-request-header-size: 10MB

spring:
  application:
    name: post

  kafka:
    bootstrap-servers: kafka:19092
    group-id: post-service-group
    partitions: 3
    replicas: 1
    trusted-packages: com.join_in.kafka_models.messages
    offset-reset: earliest
    topic:
      post-a-post: post-a-post
      post-an-image: post-an-image

  cassandra:
    contact-points: post-cassandra
    port: 9042
    keyspace-name: post_service
    local-datacenter: datacenter1
    schema-action: NONE

#Media service Feign client
media:
  service:
    feign:
      client:
        name: Media-service-Feign-client
    url:  http://media-service:8090

#Profile service Feign client
profile:
  service:
    feign:
      client:
        name: Profile-service-Feign-client
    url:  http://profile-service:8083

#Reaction service Feign client
reaction:
  service:
    feign:
      client:
        name: Reaction-service-Feign-client
    url:  http://reaction-service:8085

#Relationship service Feign client
relationship:
  service:
    feign:
      client:
        name: Relationship-service-Feign-client
    url:  http://relationship-service:8087