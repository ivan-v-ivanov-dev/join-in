services:

  # Redis
  message-redis:
    image: redis:7.4-alpine
    container_name: redis-message-service
    restart: always
    ports:
      - 6381:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - join-in-network

  # Import sample online statuses
  message-redis-init:
    image: redis:7.4-alpine
    container_name: redis-message-service-init
    restart: "no"

    depends_on:
      message-redis:
        condition: service_healthy

    entrypoint:
      - /bin/sh
      - -ec
      - |
        redis-cli -h message-redis -p 6379 SET \
          "429e71a7f1773bf2619c4c54ca4a7c67ab949efc7fffc1097a9629e8dff3528b" \
          "ONLINE"

        redis-cli -h message-redis -p 6379 SET \
          "9b5d4f5c0a71d7fef2c7c9f5f8cb45f4c1d49d6c9d4c9b9e3d6f2b1c4f8e7a91" \
          "ONLINE"

        redis-cli -h message-redis -p 6379 SET \
          "771fda51cc819105d8f3ce802fce2a4f33d23054c5a102f19872fad2a3208551" \
          "OFFLINE"

        redis-cli -h message-redis -p 6379 SET \
          "788176f5bb7f654863c2f3aa6bfaa8b49f54d0288019e9d846f772467984b627" \
          "ONLINE"

        redis-cli -h message-redis -p 6379 SET \
          "d52ae056d5830fe0a58a7da85465d6561bb0b9aba01706f010c585810b8fd3c8" \
          "OFFLINE"

        redis-cli -h message-redis -p 6379 SET \
          "8a27182c66548a4dcdc9b0cbf26227defcc076a464faa6b66e9f1c876590c94f" \
          "ONLINE"

        redis-cli -h message-redis -p 6379 SET \
          "c5f825c26e2edad6bedd8c23b5da3006638793c4a38faaa6bd49cfbe4ab6dd85" \
          "OFFLINE"

        redis-cli -h message-redis -p 6379 SET \
          "519ba91a5a5b4afb9dc66f8805ce8c442b6576316c19c6896af2fa9bda6aff71" \
          "OFFLINE"

        redis-cli -h message-redis -p 6379 SET \
          "a4fe133a6f4bc82ab1e102ba5bdc6aaa66b3e69bbfd6e64ac30ebf7708e8bff6" \
          "ONLINE"

        redis-cli -h message-redis -p 6379 SET \
          "31cae906048ac3f9dcd9525d0db54d766ffeca05e3c6f87e92f96306b8122d93" \
          "OFFLINE"
        
        redis-cli -h message-redis -p 6379 SET \
          "991f49289c5745bbeba353af157a40c48edfed061ead6d417160d9b89a54baa6" \
          "OFFLINE" 
        
        redis-cli -h message-redis -p 6379 SET \
          "aad12f3aa20775b329a00d0f0ccba97dafbc72fd925163e2e26f5ee91ec6b2cd" \
          "ONLINE" 
        
        redis-cli -h message-redis -p 6379 SET \
          "f1bc296565b36ec1932fd0b0889fb94f3fc14f56f1141f1327fd4f58cfa6a231" \
          "ONLINE" 
        
        redis-cli -h message-redis -p 6379 SET \
          "8b94a3f1bdb9d79a74bb71d933c6d0dd6c4dd08f75b89d1cbfcdf462cb0b7fd2" \
          "ONLINE"
   
        redis-cli -h message-redis -p 6379 SET \
          "3d9abcb92d1d574ef0d0d49b0cb62cb6d6fd6bb49d82f8a3a8e4a7a0d3aefb11" \
          "ONLINE"
 
        redis-cli -h message-redis -p 6379 SET \
          "0e1f7c5f7b9e92df58bbd6d9a4c7a7d5be71bbdc40d5d3cbf7dd1b7c3fd8e4b5" \
          "OFFLINE"

        echo "Sample Redis presence data imported successfully."

    networks:
      - join-in-network

  # Cassandra for Message Service
  message-cassandra:
    image: cassandra:5.0
    container_name: cassandra-message-service
    restart: unless-stopped

    ports:
      - 9043:9042

    environment:
      CASSANDRA_CLUSTER_NAME: join-in-message-cluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M

    networks:
      - join-in-network

  # Creates the schema and imports sample data
  message-cassandra-init:
    image: cassandra:5.0
    container_name: cassandra-message-service-init
    restart: "no"

    depends_on:
      - message-cassandra

    volumes:
      - ./src/main/resources/cassandra/schema.cql:/scripts/01-schema.cql:ro
      - ./src/main/resources/cassandra/sample-data.cql:/scripts/02-sample-data.cql:ro

    entrypoint: ["/bin/bash", "-c"]

    command:
      - |
        set -euo pipefail

        echo "Checking mounted CQL files..."

        test -s /scripts/01-schema.cql
        test -s /scripts/02-sample-data.cql

        ls -la /scripts

        echo "Waiting for Cassandra..."

        until cqlsh message-cassandra 9042 \
          -e "SELECT release_version FROM system.local;" \
          > /dev/null 2>&1
        do
          echo "Cassandra is not ready yet..."
          sleep 5
        done

        echo "Cassandra is ready."

        echo "Creating keyspace and tables..."

        cqlsh message-cassandra 9042 \
          --file /scripts/01-schema.cql

        echo "Verifying message_service keyspace..."

        cqlsh message-cassandra 9042 \
          -e "DESCRIBE KEYSPACE message_service;"

        echo "Importing sample data..."

        cqlsh message-cassandra 9042 \
          --file /scripts/02-sample-data.cql

        echo "Cassandra initialization completed successfully."

    networks:
      - join-in-network

  # Message Service
  message-service:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - maven_settings
    container_name: message-service
    restart: always
    ports:
      - 8091:8091
    depends_on:
      - message-redis
    networks:
      - join-in-network

networks:
  join-in-network:
    external: true

secrets:
  maven_settings:
    file: C:/Users/Иван/.m2/settings.xml