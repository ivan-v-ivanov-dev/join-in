server:
  port: 8085
  max-http-request-header-size: 10MB

spring:
  application:
    name: reaction

  kafka:
    bootstrap-servers: kafka:19092
    group-id: search-service-group
    partitions: 3
    replicas: 1
    trusted-packages: com.join_in.kafka_models.messages
    offset-reset: earliest
    topic:
      new-registered-user-info: new-registered-user-info

#Post service Feign client
post:
  service:
    feign:
      client:
        name: Post-service-Feign-client
    url:  http://post-service:8084